spring.application.name=vbtest

# H2 Embedded Mode + File-based Database
spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Reject a JSON body that repeats a field name (for example two "username" keys).
# Without this the duplicate reaches the record's constructor binding, Jackson
# fails with an InvalidDefinitionException, and the request becomes a 500
# instead of a 400.
spring.jackson.parser.strict-duplicate-detection=true

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
